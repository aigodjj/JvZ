<style>

*{box-sizing:border-box}

html,body{margin:0;background:#1b1209;color:#fff;font-family:"Courier New","Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans SC",monospace}

#app{max-width:960px;margin:0 auto;padding:6px}

header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:4px 2px 8px}

h1{font-size:clamp(14px,2.7vw,22px);margin:0;color:#ffd75e;text-shadow:2px 2px 0 #5a2d0c;letter-spacing:1px}

.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

button,select{font:inherit;font-weight:bold;font-size:13px;background:#8a5a2b;color:#fff;border:3px solid #3b240f;border-bottom-width:5px;padding:3px 10px;cursor:pointer;border-radius:4px}

button:hover,select:hover{background:#a56e36}

button:active{border-bottom-width:3px;transform:translateY(2px)}

button.big{font-size:20px;padding:8px 26px;background:#3f9a2e;border-color:#1d4d14;margin:8px 4px}

button.big:hover{background:#4fb83b}

button.big.alt{background:#8a5a2b;border-color:#3b240f}

#stage{position:relative;width:100%;aspect-ratio:960/640;background:#000;border:4px solid #3b240f;touch-action:manipulation;user-select:none}

#c{width:100%;height:100%;display:block}

.ov{position:absolute;inset:0;background:rgba(24,12,4,.92);display:flex;overflow:auto;padding:8px;text-align:center;animation:fi .4s}

@keyframes fi{from{opacity:0}to{opacity:1}}

.hidden{display:none!important}

.inner{margin:auto;max-width:900px}

.inner h2{margin:2px 0;font-size:clamp(20px,4vw,34px);color:#ffd75e;text-shadow:3px 3px 0 #5a2d0c}

.inner h3{margin:2px 0 6px;font-size:clamp(14px,2.4vw,20px);color:#9be06a}

.inner p{margin:4px auto;font-size:clamp(11px,1.8vw,14px);color:#f3e6c4;max-width:640px}

.how{list-style:none;padding:0;margin:4px auto;font-size:clamp(11px,1.8vw,14px);color:#f3e6c4;max-width:680px}

.how li{margin:2px 0}

.how.tips li{color:#ffd9a0}

.grp{font-weight:bold;color:#ffd75e;margin:8px 0 3px;font-size:14px;border-bottom:2px dashed #7a5530;display:inline-block;padding:0 14px}

.cast{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

.cc{width:122px;background:#4a2e16;border:3px solid #2a190a;border-radius:6px;padding:4px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px}

.cc canvas{width:90px;height:100px;background:#6fbf49;border:2px solid #2a190a;border-radius:4px}

.cc canvas.nt{background:#2d4a6a}.cc canvas.rf{background:#b4552f}.cc canvas.bs{background:#3a2060}.cc canvas.dk{background:#7d8f48}

.cc b{font-size:12px;color:#ffe9a8}.cc i{color:#9be06a;font-style:normal}.cc span{color:#ddd;line-height:1.25}

.note{font-size:10px;color:#a8946e;margin-top:8px}

.stages{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}

button.stg{width:158px;font-size:11px;padding:6px 4px;background:#4a2e16;border-color:#2a190a;text-align:center;line-height:1.3}

button.stg b{display:block;color:#ffe9a8;font-size:12px}

button.stg.sel{border-color:#ffd75e;background:#6b4420}

button.stg.lock{opacity:.4;cursor:not-allowed}

#endt.win{color:#ffe14a}#endt.lose{color:#ff6a5a}

.foot{font-size:11px;color:#a8946e;text-align:center;padding:6px}

a.ul{color:#a8946e;cursor:pointer;text-decoration:underline}

</style>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQueue(cfg){
 const q=[],n=cfg.waves.length;
 cfg.waves.forEach((list,w)=>{
  const base=cfg.t0+w*cfg.gap,rows=shuffle([0,1,2,3,4]);
  list.forEach((type,i)=>q.push({at:base+i*(w===n-1&&!cfg.boss?.7:1.1)+rnd(0,.5),type,row:rows[i%5],w,first:i===0}));
 });
 if(cfg.boss)q.push({at:cfg.t0+n*cfg.gap+4,type:'boss',row:2,w:n,first:true,boss:true});
 return q.sort((a,b)=>a.at-b.at);
}
function newGame(si,state='menu'){
 const cfg=STG[si],n=cfg.waves.length;
 const shadow=Array.from({length:ROWS},()=>Array(COLS).fill(false));
 if(cfg.shadows){
  for(let r=0;r<ROWS;r++){let k=0;while(k<2){const c=Math.floor(rnd(1,COLS));if(!shadow[r][c]){shadow[r][c]=true;k++}}}
  for(let i=0;i<4;i++)shadow[Math.floor(rnd(0,ROWS))][Math.floor(rnd(1,COLS))]=true;
 }
 const q=buildQueue(cfg),hugeAt=cfg.boss?cfg.t0+n*cfg.gap-2:cfg.t0+(n-1)*cfg.gap-5;
 G={si,cfg,state,paused:false,result:false,t:0,bank:cfg.bank,speed:G?G.speed:1,plants:[],zombies:[],projs:[],puffs:[],fx:[],sel:null,mx:-99,my:-99,
  grid:Array.from({length:ROWS},()=>Array(COLS).fill(null)),pots:Array.from({length:ROWS},()=>Array(COLS).fill(null)),
  graves:[],shadow,crashes:[],
  mowers:Array.from({length:ROWS},(_,r)=>({row:r,x:48,on:false,gone:false,hb:false})),
  cards:cfg.cards.map(id=>({id,cd:DEF[id].start,max:DEF[id].start||1})),queue:q,events:[{at:hugeAt,k:'huge'}],
  skyT:5,waveNo:0,totalW:n+(cfg.boss?1:0),banner:null,eb:null,spawned:false,winT:0,hype:0,blackout:0,rain:0,rainT:0,shake:0,
  graveT:18,evT:0,boss:null,nQ:q.length,doneQ:0};
 if(cfg.graves)for(let i=0;i<5;i++)addGrave(true);
}

/* ---------------- helpers ---------------- */
const live=z=>!z.dead&&!(z.air>0);
const rowHit=(z,r,s=0)=>Math.abs(z.row-r)<=s+(z.type==='boss'?1:0);
const slope=x=>(G&&G.cfg&&G.cfg.roof)?(.5-(x-X0)/(COLS*CW))*32:0;
function rowY(r){return Y0+r*CH+CH-12}
function tileAt(x,y){const c=Math.floor((x-X0)/CW),r=Math.floor((y-slope(x)-Y0)/CH);return(c>=0&&c<COLS&&r>=0&&r<ROWS)?{c,r}:null}
function addFx(o){o.t=0;G.fx.push(o)}
function dust(x,y,n,col,sp=60){for(let i=0;i<n;i++)addFx({k:'dust',x,y,vx:rnd(-sp,sp),vy:rnd(-sp*1.4,-10),g:260,max:rnd(.35,.7),r:rnd(2,5),col})}
function floatText(x,y,s,col){addFx({k:'text',x,y,s,col,max:1.3})}
function addPuff(x,y,gold,mode,ty,vx=0,vy=0,val){G.puffs.push({x,y,vx,vy,gold,v:val||(gold?75:25),moon:val===15,mode,ty,landed:false,life:11})}
function litZ(z){return G.plants.some(p=>p.id==='lulu'&&!(p.ban>0)&&Math.abs(p.r-z.row)<=1&&Math.abs(p.cx-z.x)<=CW*1.5+10)}
function shadowAt(c,r){
 if(!(G.cfg.shadows&&G.shadow[r][c])&&!(G.blackout>0))return false;
 for(const p of G.plants)if(p.id==='lulu'&&!(p.ban>0)&&Math.abs(p.c-c)<=1&&Math.abs(p.r-r)<=1)return false;
 return true;
}
function stunZ(z,t){if(z.type==='boss')t*=.15;z.stun=Math.max(z.stun,t)}
function addGrave(instant){
 if(G.graves.length>=9)return;
 for(let k=0;k<25;k++){
  const c=Math.floor(rnd(2,COLS)),r=Math.floor(rnd(0,ROWS));
  if(G.grid[r][c]||G.graves.some(g=>g.c===c&&g.r===r))continue;
  const g={c,r,x:X0+c*CW+CW/2,hp:450,max:450,rise:instant?1:0};
  G.graves.push(g);if(!instant){dust(g.x,rowY(r),10,'#6b5a40',70);Aud.sfx('place')}
  return;
 }
}
function skyCol(row) {
    // 從後三格 (索引 6, 7, 8) 中隨機挑選一個欄位降落
    const backCols = [6, 7, 8];
    return backCols[Math.floor(Math.random() * backCols.length)];
}
function spawnZ(type,row,x=W+40){
 const d=ZDEF[type];
 const z={type,row,x,hp:d.hp,max:d.hp,armor:d.armor,armorMax:d.armor,sp:d.sp,dps:d.dps,stun:0,kb:0,flash:0,bar:0,eat:false,es:0,
  headless:false,jumping:false,jumped:false,jt:0,jx:0,dead:false,dt:0,ph:Math.random()*6,air:0,airMax:1,hidden:type==='shadow',reveal:0,
  buff:1,djb:false,pose:0,slam:0,phase:1,sk:null,skt:0,cd:3.5,last:'',zx0:0,zx1:0};
 if(type==='sky'){z.air=z.airMax=1.7;z.x=X0+skyCol(row)*CW+CW/2}
 if(type==='boss'){z.row=2;G.boss=z}
 G.zombies.push(z);return z;
}
function hurt(z,d){
 if(z.dead||z.air>0)return;
 z.flash=.12;z.bar=2.5;z.reveal=3;Aud.sfx('hit');
 if(z.armor>0){
  z.armor-=d;
  if(z.armor>0)return;
  d=-z.armor;z.armor=0;dust(z.x,rowY(z.row)-80,8,z.type==='cone'?'#f27d1a':'#f4c52d',90);if(d<=0)return;
 }
 z.hp-=d;
 if(z.hp<=0){killZ(z);return}
 if(z.type!=='head'&&z.type!=='boss'&&!z.headless&&z.hp<=z.max*.4){
  z.headless=true;Aud.sfx('pop');
  spawnZ('head',z.row,z.x-6);
  dust(z.x,rowY(z.row)-70,10,'#a9c698',100);
 }
}
function killZ(z){
 if(z.dead)return;z.dead=true;z.dt=0;z.eat=false;
 if(z.type==='boss'){
  Aud.sfx('boss');G.shake=.9;dust(z.x,rowY(z.row)-60,40,'#ffd75e',220);dust(z.x,rowY(z.row)-60,30,'#ff6a5a',200);
  for(const o of G.zombies)if(o!==z)killZ(o);
 }else{Aud.sfx('die');dust(z.x,rowY(z.row)-30,10,'#8aa878',80)}
}
function removePlant(p){
 p.gone=true;
 if(p.id==='pot'){G.pots[p.r][p.c]=null;const d=G.grid[p.r][p.c];if(d){d.gone=true;G.grid[p.r][p.c]=null}}
 else G.grid[p.r][p.c]=null;
 G.plants=G.plants.filter(q=>!q.gone);
}
function placePlant(id,c,r){
 const d=DEF[id],cx=X0+c*CW+CW/2;
 const p={id,c,r,cx,fy:rowY(r)+slope(cx),hp:d.hp,max:d.hp,tm:0,next:id==='shroom'?6:9,n:0,cd:.8,anim:0,stomp:0,did:false,boom:null,rt:9,ban:0,sf:1,gone:false,ph:Math.random()*6};
 if(id==='pot')G.pots[r][c]=p;else G.grid[r][c]=p;
 G.plants.push(p);dust(p.cx,p.fy,8,'#7a5a30',50);Aud.sfx('place');
}
function canPlace(id,c,r){
 if(G.graves.some(g=>g.c===c&&g.r===r))return 1;
 if(id==='pot')return(G.cfg.roof&&!G.pots[r][c])?0:1;
 if(G.grid[r][c])return 1;
 if(G.cfg.roof&&!G.pots[r][c])return 2;
 return 0;
}
function inRange(p,z,front,span){return live(z)&&z.x<W+10&&rowHit(z,p.r,span)&&z.x>p.cx-30&&z.x<p.cx+front}
function crackGraves(p,front,dmg,span){for(const g of G.graves)if(Math.abs(g.r-p.r)<=span&&g.x>p.cx-30&&g.x<p.cx+front)g.hp-=dmg}

/* ---------------- events & boss ---------------- */
function startEvent(k){
 G.eb={k,t:3.4};Aud.sfx('warn');
 if(k==='ev_rain'){G.rain=7;G.rainT=0}
 else if(k==='ev_crash'){for(let i=0;i<7;i++)G.crashes.push({c:Math.floor(rnd(1,COLS)),r:Math.floor(rnd(0,ROWS)),t:2+i*.35})}
 else if(k==='ev_hype')G.hype=12;
 else if(k==='ev_blackout')G.blackout=12;
}
function summon(z,n){
 const pool=['dakai','cone','legs'];if(z.phase>=2)pool.push('shadow','dj');if(z.phase>=3)pool.push('helmet','hands');
 const rows=shuffle([0,1,2,3,4]);
 for(let i=0;i<n;i++)spawnZ(pool[Math.floor(Math.random()*pool.length)],rows[i],Math.min(W+30,z.x-70));
 floatText(z.x-40,rowY(z.row)-210,T().msg.sub,'#7dffb0');Aud.sfx('pop');
}
function doSmash(z){
 Aud.sfx('smash');G.shake=.55;floatText(z.x-80,rowY(z.row)-200,T().msg.smash,'#ff6a5a');
 for(const p of G.plants)if(Math.abs(p.r-z.row)<=1&&p.cx>z.zx0-30&&p.cx<z.zx1+30)p.hp-=p.id==='pot'?9999:420;
 for(let k=-1;k<=1;k++)for(let x=z.zx0;x<z.zx1;x+=70)dust(x,rowY(z.row+k),3,'#c9a46a',90);
}
function bossAI(z,dt){
 const r=z.hp/z.max,ph=r>.66?1:(r>.33?2:3);
 if(ph>z.phase){z.phase=ph;G.eb={k:ph===2?'phase2':'phase3',t:3.4};Aud.sfx('boss');G.shake=.5;summon(z,2)}
 z.slam=Math.max(0,z.slam-dt);
 if(z.sk==='smash'){
  z.skt-=dt;z.pose=clamp(1-z.skt/1.1,0,1);
  if(z.skt<=0){doSmash(z);z.sk=null;z.pose=0;z.slam=.35;z.cd=rnd(3.8,5.2)-(z.phase-1)*.8}
  return;
 }
 if(z.x>780)return;
 z.cd-=dt;
 if(z.cd>0)return;
 const pool=['smash','sub'];if(z.phase>=2)pool.push('demo');if(z.phase>=3)pool.push('sky');
 let k;do{k=pool[Math.floor(Math.random()*pool.length)]}while(k===z.last&&pool.length>1);
 z.last=k;
 if(k==='smash'){z.sk='smash';z.skt=1.1;z.zx0=Math.max(X0-10,z.x-250);z.zx1=z.x-5;Aud.sfx('warn');return}
 if(k==='sub')summon(z,3);
 else if(k==='demo'){
  const ts=shuffle(G.plants.filter(p=>p.id!=='pot'&&!(p.ban>0)));
  ts.slice(0,z.phase>=3?3:2).forEach(p=>{p.ban=7;floatText(p.cx,p.fy-90,T().msg.demo,'#ff6a5a');dust(p.cx,p.fy-40,8,'#ff4040',70)});
  if(ts.length)Aud.sfx('ban');
 }else if(k==='sky'){
  const rows=shuffle([0,1,2,3,4]);for(let i=0;i<(z.phase>=3?3:2);i++)spawnZ('sky',rows[i]);Aud.sfx('warn');
 }
 z.cd=rnd(3.8,5.2)-(z.phase-1)*.8;
}
function landSky(z){
 z.air=0;dust(z.x,rowY(z.row)+slope(z.x),10,'#bbb',90);Aud.sfx('stomp');
 for(const p of G.plants)if(p.r===z.row&&Math.abs(p.cx-z.x)<CW*.55)p.hp-=p.id==='pot'?60:150;
 addFx({k:'ring',x:z.x,y:rowY(z.row)+slope(z.x)-6,r0:10,r1:60,max:.4,col:'#ffffff'});
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt){
 const cfg=G.cfg;
 G.t+=dt;
 const alive=G.zombies.some(z=>!z.dead);
 if(G.spawned&&!alive&&G.queue.length&&G.queue[0].at-G.t>7)G.t=G.queue[0].at-5;
 while(G.queue.length&&G.queue[0].at<=G.t){
  const e=G.queue.shift();G.doneQ++;
  if(e.boss){spawnZ('boss',2,W+110);Aud.sfx('boss');G.banner={k:'boss',t:3.8};G.evT=14;G.waveNo=e.w+1}
  else spawnZ(e.type,e.row);
  G.spawned=true;
  if(e.first&&!e.boss){
   G.waveNo=e.w+1;const fin=e.w===G.totalW-1;G.banner={k:fin?'final':'wave',n:e.w+1,t:2.6};if(fin)Aud.sfx('warn');
   if(cfg.wev&&cfg.wev[e.w])startEvent(cfg.wev[e.w]);
  }
 }
 while(G.events.length&&G.events[0].at<=G.t){const e=G.events.shift();G.banner={k:e.k,t:3};Aud.sfx('warn')}
 if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
 if(G.eb){G.eb.t-=dt;if(G.eb.t<=0)G.eb=null}
 G.hype=Math.max(0,G.hype-dt);G.blackout=Math.max(0,G.blackout-dt);G.shake=Math.max(0,G.shake-dt*1.4);
 if(cfg.boss&&G.boss&&!G.boss.dead){G.evT-=dt;if(G.evT<=0){G.evT=rnd(20,27);startEvent(['ev_rain','ev_crash','ev_hype','ev_blackout'][Math.floor(Math.random()*4)])}}
 for(const c of G.cards)c.cd=Math.max(0,c.cd-dt);
 // sky puffs / rain
 if(cfg.sky){G.skyT-=dt;if(G.skyT<=0){G.skyT=rnd(cfg.sky[0],cfg.sky[1]);addPuff(rnd(X0+30,X0+COLS*CW-30),-20,false,'fall',rnd(190,590))}}
 if(G.rain>0){G.rain-=dt;G.rainT-=dt;if(G.rainT<=0){G.rainT=.33;addPuff(rnd(X0+30,X0+COLS*CW-30),-20,false,'fall',rnd(190,590))}}
 // gravestones
 if(cfg.graves){
  G.graveT-=dt;if(G.graveT<=0){G.graveT=rnd(20,26);addGrave(false)}
  for(const g of G.graves)g.rise=Math.min(1,g.rise+dt*1.4);
  G.graves=G.graves.filter(g=>{if(g.hp<=0){dust(g.x,rowY(g.r)-20,12,'#9a9da8',90);Aud.sfx('pop');return false}return true});
 }
 // stage lights crash
 for(const m of G.crashes){
  m.t-=dt;
  if(m.t<=0){
   const cx=X0+m.c*CW+CW/2;m.done=true;Aud.sfx('smash');G.shake=Math.max(G.shake,.3);
   addFx({k:'ring',x:cx,y:rowY(m.r)-10,r0:10,r1:80,max:.5,col:'#ffd75e'});dust(cx,rowY(m.r),10,'#ffd75e',100);
   for(const p of G.plants)if(p.r===m.r&&p.c===m.c)p.hp-=220;
   for(const z of G.zombies)if(live(z)&&rowHit(z,m.r,0)&&Math.abs(z.x-cx)<60)hurt(z,100);
  }
 }
 G.crashes=G.crashes.filter(m=>!m.done);
 // plant factors
 for(const p of G.plants){
  p.sf=1;
  if(shadowAt(p.c,p.r))p.sf*=.75;
  for(const l of G.plants)if(l.id==='lulu'&&l!==p&&!(l.ban>0)&&Math.abs(l.c-p.c)<=1&&Math.abs(l.r-p.r)<=1){p.sf*=1.2;break}
 }
 // plants
 for(const p of G.plants){
  if(p.gone)continue;
  if(p.hp<=0){removePlant(p);dust(p.cx,p.fy-30,10,'#d9b070',90);continue}
  if(p.id==='pot'||p.id==='lulu')continue;
  if(p.ban>0){p.ban-=dt;continue}
  const d=dt*p.sf;
  if(p.id==='ding'){
   p.tm+=d;
   if(p.tm>=p.next){
    p.tm=0;p.next=20;p.n++;const gold=p.n%3===0;
    addPuff(p.cx+10,p.fy-50,gold,'arc',p.fy-8,rnd(-30,50),-170);Aud.sfx('bake');
    if(gold)floatText(p.cx,p.fy-90,'Golden Eclair!','#ffe14a');
   }
  }else if(p.id==='shroom'){
   p.tm+=d;
   if(p.tm>=p.next){p.tm=0;p.next=10;addPuff(p.cx+8,p.fy-40,false,'arc',p.fy-6,rnd(-25,40),-150,15);Aud.sfx('bake')}
  }else if(p.id==='jie'){
   p.cd-=d;p.anim=Math.max(0,p.anim-d*2.5);
   if(!p.boom&&p.cd<=0&&G.zombies.some(z=>live(z)&&!z.hidden&&rowHit(z,p.r,0)&&z.x>p.cx&&z.x<W)){
    const sx=p.cx+16;
    p.boom={k:'boom',row:p.r,x:sx,y0:p.fy-40-(G.cfg.roof?24:0),dir:1,start:sx,home:sx,far:Math.min(sx+600,W-20),hit:new Set(),rot:0,owner:p};
    G.projs.push(p.boom);p.anim=1;Aud.sfx('throw');
   }
  }else if(p.id==='spore'){
   p.cd-=d;p.anim=Math.max(0,p.anim-d*4);
   const roof=G.cfg.roof,rng=CW*(roof?5.5:4.2);
   let tg=null;
   for(const z of G.zombies)if(live(z)&&!z.hidden&&rowHit(z,p.r,0)&&z.x>p.cx+10&&z.x<p.cx+rng&&(!tg||z.x<tg.x))tg=z;
   if(tg&&p.cd<=0){
    p.cd=1.45;p.anim=1;Aud.sfx('throw');
    const yy=p.fy-24-(roof?24:0);
    if(roof){
     const x0=p.cx+34,x1=clamp(tg.x-tg.sp*tg.buff*.9,p.cx+60,W-20);
     G.projs.push({k:'lob',row:p.r,x0,x1,u:0,T:.85,dmg:30,y0:yy,x:x0,y:yy});
    }else G.projs.push({k:'spore',row:p.r,x:p.cx+34,y:yy,vx:330,max:p.cx+CW*4.4,dmg:20});
   }
  }else if(p.id==='bao'){
   p.cd-=d;
   if(p.stomp>0){
    p.stomp+=d/.6;
    if(!p.did&&p.stomp>=.7){
     p.did=true; Aud.sfx('stomp');
     for(let k=-1;k<=1;k++){const r=p.r+k;if(r<0||r>=ROWS)continue;
      const rx=p.cx+CW*1.2;addFx({k:'ring',x:rx,y:rowY(r)+slope(rx)-6,r0:20,r1:CW*1.5,max:.45,col:'#ff9ec0'})}
     dust(p.cx+30,p.fy,12,'#c9a46a',120);
     crackGraves(p,CW*2.5,170,1);
     for(const z of G.zombies)if(inRange(p,z,CW*2.5,1)){hurt(z,50);if(!z.dead)stunZ(z,1.8)}
    }
    if(p.stomp>=1)p.stomp=0;
   }else if(p.cd<=0&&G.zombies.some(z=>inRange(p,z,CW*2.3,1))){p.stomp=.001;p.did=false;p.cd=3.4}
  }else if(p.id==='lion'){
   p.rt=Math.min(14,p.rt+d);p.anim=Math.max(0,p.anim-d*1.6);
   if(p.rt>=14&&G.zombies.some(z=>inRange(p,z,CW*2.1,1))){
    p.rt=0;p.anim=1;Aud.sfx('roar');
    addFx({k:'ring',x:p.cx+20,y:p.fy-50,r0:20,r1:230,max:.7,col:'#ffb040',tall:true});
    addFx({k:'ring',x:p.cx+20,y:p.fy-50,r0:10,r1:180,max:.55,col:'#fff2b0',tall:true});
    crackGraves(p,CW*2.1,200,1);
    for(const z of G.zombies)if(inRange(p,z,CW*2.1,1)){
     if(z.type!=='boss')z.kb=80;
     stunZ(z,2.3);hurt(z,15);floatText(z.x,rowY(z.row)-110,'!!','#ffb040');
    }
   }
  }
 }
 /* ---------- DJ aura / hype buffs ---------- */
 const djs=G.zombies.filter(z=>z.type==='dj'&&live(z));
 for(const z of G.zombies){
  z.buff=1;z.djb=false;
  if(z.type==='boss')continue;
  if(G.hype>0)z.buff*=1.35;
  if(z.type!=='dj'&&djs.some(q=>Math.abs(q.row-z.row)<=1&&Math.abs(q.x-z.x)<230)){z.buff*=1.5;z.djb=true}
 }
 /* ---------- zombies ---------- */
 for(const z of G.zombies){
  if(z.dead){z.dt+=dt;continue}
  if(z.air>0){z.air-=dt;if(z.air<=0){landSky(z);z.stun=.4}continue}
  z.flash=Math.max(0,z.flash-dt);z.bar=Math.max(0,z.bar-dt);z.reveal=Math.max(0,z.reveal-dt);
  const boss=z.type==='boss';
  if(z.headless&&!boss){z.hp-=8*dt;if(z.hp<=0){killZ(z);continue}}
  if(z.type==='shadow')z.hidden=!(z.reveal>0||z.eat||litZ(z)||G.plants.some(p=>!p.gone&&p.r===z.row&&p.cx<z.x&&z.x-p.cx<110));
  const slow=z.headless?.7:1;
  if(boss){bossAI(z,dt);if(z.sk==='smash')continue}
  if(z.jumping){
   z.jt+=dt/.8;const q=Math.min(1,z.jt);z.x=z.jx-130*q;
   if(q>=1){z.jumping=false;z.jumped=true;z.sp=17;dust(z.x,rowY(z.row)+slope(z.x),6,'#7a5a30',60)}
  }else if(z.stun>0){z.stun-=dt;z.eat=false}
  else{
   if(z.kb>0){const k=Math.min(z.kb,420*dt);z.x+=k;z.kb-=k}
   if(z.type==='legs'&&!z.jumped&&G.plants.some(p=>!p.gone&&p.r===z.row&&p.cx<z.x&&z.x-p.cx<85)){z.jumping=true;z.jt=0;z.jx=z.x;Aud.sfx('jump');continue}
   let tgt=null;const reach=boss?85:55;
   for(const p of G.plants)if(!p.gone&&rowHit(z,p.r,0)&&p.cx<z.x&&z.x-p.cx<reach&&(!tgt||p.cx>tgt.cx||(p.cx===tgt.cx&&tgt.id==='pot')))tgt=p;
   if(tgt){
    z.eat=true;tgt.hp-=z.dps*slow*dt;z.es-=dt;if(z.es<=0){z.es=.6;Aud.sfx('chomp')}
   }else{z.eat=false;z.x-=z.sp*slow*z.buff*dt}
  }
  // mowers / lose
  const lim=boss?X0+50:X0-10;
  for(const r of(boss?[1,2,3]:[z.row])){const m=G.mowers[r];if(z.x<lim&&!m.gone&&!m.on){m.on=true;Aud.sfx('mower')}}
  if(boss){if(z.x<60&&G.state==='play')endGame(false)}
  else if(z.x<36&&G.mowers[z.row].gone&&G.state==='play')endGame(false);
 }
 G.zombies=G.zombies.filter(z=>!z.dead||z.dt<.9);
 /* ---------- mowers ---------- */
 for(const m of G.mowers){
  if(!m.on)continue;
  m.x+=380*dt;
  for(const z of G.zombies)if(live(z)&&rowHit(z,m.row,0)&&z.x>m.x-30&&z.x<m.x+50){
   if(z.type==='boss'){if(!m.hb){m.hb=true;hurt(z,700);G.shake=.4;dust(m.x+20,rowY(m.row)-30,14,'#ffd75e',140);floatText(z.x,rowY(z.row)-200,'-700','#ff6a5a')}}
   else killZ(z);
  }
  if(m.x>W+60){m.on=false;m.gone=true}
 }
 /* ---------- projectiles ---------- */
 for(const b of G.projs){
  if(b.k==='boom'){
   const roof=cfg.roof,spd=roof?(b.dir>0?370:500):420;
   b.x+=b.dir*spd*dt;b.rot+=dt*18;
   b.y=b.y0+slope(b.x)-slope(b.start);
   if(b.dir>0){
    if(b.x>=b.far){b.dir=-1;b.hit.clear()}
    else for(const g of G.graves)if(g.r===b.row&&g.rise>.5&&Math.abs(g.x-b.x)<26){g.hp-=45;b.dir=-1;b.hit.clear();dust(b.x,b.y,6,'#9a9da8',70);Aud.sfx('hit');break}
   }
   for(const z of G.zombies)if(live(z)&&rowHit(z,b.row,0)&&!b.hit.has(z)&&Math.abs(z.x-b.x)<28){
    b.hit.add(z);hurt(z,36);dust(b.x,b.y,4,'#f5a640',50);
   }
   if(b.dir<0&&b.x<=b.home){b.done=true;if(b.owner)b.owner.boom=null}
  }else if(b.k==='spore'){
   b.x+=b.vx*dt;
   let gone=b.x>b.max;
   for(const g of G.graves)if(!gone&&g.r===b.row&&g.rise>.5&&Math.abs(g.x-b.x)<22){g.hp-=b.dmg;gone=true;dust(b.x,b.y,4,'#9a9da8',50)}
   if(!gone)for(const z of G.zombies)if(live(z)&&!z.hidden&&rowHit(z,b.row,0)&&Math.abs(z.x-b.x)<22){hurt(z,b.dmg);dust(b.x,b.y,4,'#c9ff7a',50);gone=true;break}
   if(gone)b.done=true;
  }else if(b.k==='lob'){
   b.u+=dt/b.T;const u=Math.min(1,b.u);
   b.x=b.x0+(b.x1-b.x0)*u;
   const gy=rowY(b.row)+slope(b.x)-30;
   b.y=b.y0+(gy-b.y0)*u-Math.sin(Math.PI*u)*80;
   if(b.u>=1){
    b.done=true;Aud.sfx('pop');
    addFx({k:'ring',x:b.x,y:gy+24,r0:10,r1:75,max:.4,col:'#c9ff7a'});dust(b.x,gy+20,8,'#c9ff7a',80);
    for(const z of G.zombies)if(live(z)&&rowHit(z,b.row,1)&&Math.abs(z.x-b.x)<(Math.abs(z.row-b.row)<=(z.type==='boss'?1:0)?75:48))hurt(z,b.dmg);
   }
  }
 }
 G.projs=G.projs.filter(b=>!b.done);
 /* ---------- puffs ---------- */
 for(const q of G.puffs){
  if(!q.landed){
   if(q.mode==='fall'){q.y+=80*dt;if(q.y>=q.ty){q.y=q.ty;q.landed=true}}
   else{q.vy+=520*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.vy>0&&q.y>=q.ty){q.y=q.ty;q.landed=true}}
  }else q.life-=dt;
 }
 G.puffs=G.puffs.filter(q=>q.life>0);
 /* ---------- fx ---------- */
 for(const f of G.fx){f.t+=dt;if(f.k==='dust'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.g*dt}}
 G.fx=G.fx.filter(f=>f.t<f.max);
 /* ---------- victory ---------- */
 if(G.state==='play'&&G.spawned&&!G.queue.length&&!G.zombies.some(z=>!z.dead)){
  G.winT+=dt;if(G.winT>1.5)endGame(true);
 }else G.winT=0;
}

let CLR=parseInt(store.get('jg_cleared')||'0',10)||0;
function endGame(win){
 if(!G||G.state!=='play')return;
 G.state='over';G.result=win;G.sel=null;Aud.stop();Aud.sfx(win?'win':'lose');
 if(win){
  CLR|=1<<G.si;store.set('jg_cleared',String(CLR));

 }
 const g=G;
 setTimeout(()=>{if(G===g&&G.state==='over')showEnd(win)},win?700:350);

}

}

  drawUnit(ctx,cd.id,x+35,y+64,cd.id==='pot'?.95:.6,ANIM+i,0,true);
  if(cd.cd>0){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x+2,y+2,66,94*clamp(cd.cd/cd.max,0,1))}
  else if(!afford){ctx.fillStyle='rgba(60,0,0,.35)';ctx.fillRect(x+2,y+2,66,94)}
  ctx.restore();
  txt(String(def.cost),x+35,y+92,14,afford?'#fff':'#ff8a8a');
  txt(String(i+1),x+9,y+15,11,'#5a3a1e');
 });
 // shovel
 rr(ctx,700,3,60,98,6,G.sel==='shovel'?'#8a6a2a':'#4a2e16',3);
 ln(ctx,746,26,722,66,'#8a5a2b',6);ln(ctx,740,22,754,30,'#6b4420',6);
 poly(ctx,[[708,68],[726,60],[734,80],[714,90]],'#c8c8d0',2);
 txt(t.shovel,730,96,11,'#fff');
 // progress
 rr(ctx,772,3,184,98,8,'#4a2e16',3);
 txt(t.progress,864,22,11,'#ffe9a8');
 rr(ctx,784,32,160,14,6,'#222',2);
 const f=G.nQ?clamp(G.doneQ/G.nQ,0,1):0;
 if(f>0)rr(ctx,785,33,158*f,12,5,'#6fd04a',0);
 ell(ctx,944-158*(1-f)-0,39,8,8,'#a9c698',1.5);
 if(G.waveNo>0)txt(t.waveOf.replace('{n}',G.waveNo).replace('{m}',G.totalW),864,72,14,'#fff');
 if(G.cfg.shadows)txt('☾',864,94,13,'#c9a0ff','center');
 // boss bar
 const b=G.boss;
 if(b&&!b.dead&&b.x<W+20){
  const hp=clamp(b.hp/b.max,0,1);
  rr(ctx,250,107,460,12,5,'#222',2);rr(ctx,251,108,458*hp,10,4,b.phase>=3?'#ff3a4a':(b.phase===2?'#ff9a3a':'#d8453a'),0);
  txt(t.z.boss[0],480,104,11,'#ffe9a8');
 }
}
function drawBanners(){
 const t=T();
 if(G.eb){
  const s=t.ban[G.eb.k];
  ctx.save();ctx.globalAlpha=Math.min(1,G.eb.t/.5);
  rr(ctx,130,128,700,38,10,'rgba(20,10,30,.7)',0);
  fitTxt(s,480,155,24,G.eb.k.indexOf('phase')===0?'#ff6a5a':'#ffd75e',660);ctx.restore();
 }
 if(G.banner){
  const B=G.banner;let s='',col='#ffe14a';
  if(B.k==='wave')s=t.waveN.replace('{n}',B.n);
  else if(B.k==='final'){s=t.final;col='#ff6a5a'}
  else if(B.k==='huge'){s=t.huge;col='#ff9a5a'}
  else if(B.k==='boss'){s=t.ban.boss;col='#ff4a5a'}
  else s=sname(G.si);
  ctx.save();ctx.globalAlpha=Math.min(1,B.t/.5);
  const pop=1+Math.max(0,B.t-(B.k==='boss'?3.3:2.2))*.6;
  ctx.translate(W/2,H/2-20);ctx.scale(pop,pop);ctx.translate(-W/2,-(H/2-20));
  rr(ctx,40,H/2-70,W-80,80,14,'rgba(20,10,5,.55)',0);
  fitTxt(s,W/2,H/2-14,46,col,W-120);ctx.restore();
 }
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 ctx.save();
 if(G.shake>0)ctx.translate(rnd(-1,1)*G.shake*9,rnd(-1,1)*G.shake*9);
 drawHudBg();drawLawn();
 // hover highlight / ghost
 if(G.state==='play'&&G.sel){
  const tl=tileAt(G.mx,G.my);
  if(tl){
   const x=X0+tl.c*CW,y=Y0+tl.r*CH;
   let ok;
   if(G.sel==='shovel')ok=!!(G.grid[tl.r][tl.c]||G.pots[tl.r][tl.c]);else ok=canPlace(G.sel,tl.c,tl.r)===0;
   const col=ok?'rgba(120,255,120,.28)':'rgba(255,80,80,.28)';
   if(G.cfg.roof)poly(ctx,[[x,y+slope(x)],[x+CW,y+slope(x+CW)],[x+CW,y+CH+slope(x+CW)],[x,y+CH+slope(x)]],col,0);
   else{ctx.fillStyle=col;ctx.fillRect(x,y,CW,CH)}
   if(ok&&G.sel!=='shovel'){
    const cx=x+CW/2;ctx.save();ctx.globalAlpha=.55;
    const fy=rowY(tl.r)+slope(cx);
    if(G.sel==='pot')drawPot(ctx,cx,fy,1.05);else drawUnit(ctx,G.sel,cx,fy-(G.cfg.roof?22:0),1,ANIM,0,true);
    ctx.restore();
   }
  }
 }
 // crash markers
 for(const m of G.crashes){
  const cx=X0+m.c*CW+CW/2,gy=rowY(m.r)+slope(cx);
  ell(ctx,cx,gy,36,12,'rgba(255,60,60,'+(.25+.2*Math.sin(ANIM*14))+')',0);
  const hy=gy-60-Math.max(0,m.t)*260;
  rr(ctx,cx-24,hy-14,48,16,3,'#555',2);ell(ctx,cx-14,hy+4,6,6,'#ffe680',1.5);ell(ctx,cx+14,hy+4,6,6,'#ffe680',1.5);ln(ctx,cx,hy-14,cx,hy-60,'#888',3);
 }
 // y-sorted entities
 const items=[];
 for(const g of G.graves)items.push({y:rowY(g.r),f:()=>drawGrave(ctx,g.x,rowY(g.r),Math.max(.02,g.rise),g.hp/g.max)});
 for(const p of G.plants)items.push({y:p.fy+(p.id==='pot'?0:.1),f:()=>drawPlant(p)});
 for(const z of G.zombies)items.push({y:z.air>0?9999:(z.type==='boss'?rowY(z.row)+CH*1.1:rowY(z.row)+slope(z.x)),f:()=>drawZombie(z)});
 for(const m of G.mowers)if(!m.gone)items.push({y:rowY(m.row)+slope(m.x)-1,f:()=>drawMower(ctx,m.x,rowY(m.row)+slope(m.x),ANIM,m.on)});
 items.sort((a,b)=>a.y-b.y);
 for(const it of items)it.f();
 // projectiles
 for(const b of G.projs){
  if(b.k==='boom'){
   ell(ctx,b.x,rowY(b.row)+slope(b.x)-6,14,4,'rgba(0,0,0,.25)',0);
   tailShape(ctx,b.x,b.y,b.rot,.9);
  }else if(b.k==='spore'){
   ell(ctx,b.x,b.y,9,9,'rgba(201,255,122,.3)',0);ell(ctx,b.x,b.y,5.5,5.5,'#c9ff7a',1.5);
  }else{
   ell(ctx,b.x,rowY(b.row)+slope(b.x)-6,10,3.5,'rgba(0,0,0,.25)',0);
   ell(ctx,b.x,b.y,10,10,'rgba(255,179,106,.3)',0);ell(ctx,b.x,b.y,6.5,6.5,'#ffb36a',1.5);
  }
 }
 // time-of-day tint / events
 const th=THEME[G.si];
 if(th.tint){ctx.fillStyle=th.tint;ctx.fillRect(0,106,W,H-106)}
 if(G.blackout>0){ctx.fillStyle='rgba(0,0,15,'+(.5*Math.min(1,G.blackout)).toFixed(3)+')';ctx.fillRect(0,106,W,H-106)}
 if(G.hype>0){
  const gr=ctx.createRadialGradient(W/2,H/2,300,W/2,H/2,620),a=.18+.1*Math.sin(ANIM*8);
  gr.addColorStop(0,'rgba(255,60,20,0)');gr.addColorStop(1,'rgba(255,60,20,'+a+')');
  ctx.fillStyle=gr;ctx.fillRect(0,106,W,H-106);
 }
 // puffs
 for(const q of G.puffs){
  if(q.landed&&q.life<3&&Math.floor(ANIM*8)%2)continue;
  const bob=q.landed?Math.sin(ANIM*4+q.x)*2:0;
  if(q.moon){ell(ctx,q.x,q.y+bob,19,19,'rgba(150,200,255,.5)',0);drawPuff(ctx,q.x,q.y+bob,.8,false,ANIM)}
  else drawPuff(ctx,q.x,q.y+bob,q.gold?1.05:1,q.gold,ANIM);
 }
 // fx
 for(const f of G.fx){
  const k=f.t/f.max;
  if(f.k==='dust'){ctx.globalAlpha=Math.max(0,1-k);ell(ctx,f.x,f.y,f.r,f.r,f.col,0);ctx.globalAlpha=1}
  else if(f.k==='ring'){
   const r=f.r0+(f.r1-f.r0)*k;ctx.globalAlpha=Math.max(0,1-k);ctx.strokeStyle=f.col;ctx.lineWidth=5;
   ctx.beginPath();ctx.ellipse(f.x,f.y,r,f.tall?r:r*.35,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }else if(f.k==='text'){ctx.globalAlpha=Math.max(0,1-k*k);txt(f.s,f.x,f.y-f.t*35,16,f.col);ctx.globalAlpha=1}
 }
 ctx.restore();
 drawHud();drawBanners();
 if(G.state==='play'&&G.paused){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt(T().paused,W/2,H/2,48,'#ffd75e');
 }
}

/* =========================================================
   INPUT
   ========================================================= */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(G)G.sel=null});
cv.addEventListener('pointermove',e=>{if(!G)return;const p=pos(e);G.mx=p.x;G.my=p.y});
cv.addEventListener('pointerdown',e=>{
 if(!G||G.state!=='play'||G.paused)return;
 const p=pos(e);G.mx=p.x;G.my=p.y;
 if(e.button===2){G.sel=null;return}
 Aud.init();
 const x=p.x,y=p.y;
 // collect puffs
 for(let i=G.puffs.length-1;i>=0;i--){
  const q=G.puffs[i];
  if(Math.abs(q.x-x)<28&&Math.abs(q.y-y)<28){
   G.bank+=q.v;Aud.sfx('collect');floatText(q.x,q.y-20,'+'+q.v,q.gold?'#ffe14a':'#fff');
   G.puffs.splice(i,1);return;
  }
 }
 // cards
 if(y<104){
  for(let i=0;i<G.cards.length;i++){
   const cx=96+i*74;
   if(x>=cx&&x<=cx+70)return pickCard(i);
  }
  if(x>=700&&x<=760){G.sel=G.sel==='shovel'?null:'shovel';Aud.sfx('shovel')}
  return;
 }
 if(!G.sel)return;
 const tl=tileAt(x,y);if(!tl){return}
 const{c,r}=tl;
 if(G.sel==='shovel'){
  const pl=G.grid[r][c]||G.pots[r][c];
  if(pl){removePlant(pl);Aud.sfx('shovel');dust(pl.cx,pl.fy-20,8,'#d9b070',70)}
  G.sel=null;return;
 }
 const id=G.sel,cd=G.cards.find(k=>k.id===id),def=DEF[id];
 if(!cd||cd.cd>0||G.bank<def.cost){G.sel=null;Aud.sfx('no');return}
 const code=canPlace(id,c,r),cx=X0+c*CW+CW/2;
 if(code===2){floatText(cx,rowY(r)+slope(cx)-60,T().msg.pot,'#ff8a5a');Aud.sfx('no');return}
 if(code===1){Aud.sfx('no');return}
 G.bank-=def.cost;
 const sh=shadowAt(c,r);
 cd.max=cd.cd=def.cd*(sh?1.8:1);
 if(sh)floatText(cx,rowY(r)-60,T().msg.shadow,'#c9a0ff');
 placePlant(id,c,r);
 G.sel=null;
});
function pickCard(i){
 const cd=G.cards[i],def=DEF[cd.id];
 if(cd.cd>0||G.bank<def.cost){Aud.sfx('no');return}
 G.sel=G.sel===cd.id?null:cd.id;Aud.sfx('shovel');
}
window.addEventListener('keydown',e=>{
 if(!G||G.state!=='play')return;
 if(e.key==='Escape'){G.sel=null;return}
 if(e.key==='p'||e.key==='P'){togglePause();return}
 if(G.paused)return;
 const n=parseInt(e.key,10);
 if(n>=1&&n<=G.cards.length)pickCard(n-1);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.state==='play'&&!G.paused)togglePause()});

$('selLang').value=L;
$('selLang').addEventListener('change',e=>{
 L=e.target.value;store.set('jg_lang',L);refreshUI();
 if(G.state==='menu')buildMenu();
 else if(G.state==='over'&&!$('end').classList.contains('hidden'))showEnd(G.result);
});
$('bPause').addEventListener('click',togglePause);
$('bSpeed').addEventListener('click',()=>{G.speed=G.speed%3+1;refreshUI()});
$('bMute').addEventListener('click',()=>{Aud.init();Aud.toggleMute();refreshUI()});
$('bRestart').addEventListener('click',()=>{if(G.state==='menu')return;startStage(G.si)});

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
 ANIM+=dt;
 if(G.state==='play'&&!G.paused){
  for(let i=0;i<G.speed;i++){update(dt);if(G.state!=='play')break}
 }
 render();
 requestAnimationFrame(frame);
}
newGame(0,'menu');
buildMenu();refreshUI();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
